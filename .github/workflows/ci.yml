name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"
      - name: ruff check
        run: ruff check --output-format=github
      - name: ruff format --check
        run: ruff format --check

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            node/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            node/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: docker compose build
        run: docker compose build
      - name: docker compose up
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: |
          set -euo pipefail
          # Services without a healthcheck are only "running" after --wait, so retry each check.
          expect() {
            local want=$1; shift
            local got=""
            for _ in $(seq 1 15); do
              got=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 10 "$@" || true)
              [ "$got" = "$want" ] && break
              sleep 2
            done
            echo "expected $want, got $got: $*"
            head -c 500 /tmp/body; echo
            [ "$got" = "$want" ]
          }
          expect 200 -X POST -H 'Content-Type: application/json' -d '{"value": "ok"}' \
            http://localhost:8000/kv/ci-smoke
          expect 200 http://localhost:8000/kv/ci-smoke
          jq -e '.value == "ok"' /tmp/body
          expect 404 http://localhost:8000/kv/does-not-exist
          expect 200 http://localhost:8000/metrics
          grep -q 'distrocache_' /tmp/body
          expect 200 http://localhost:3000/
          expect 200 http://localhost:9090/-/ready
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: docker compose down
        if: always()
        run: docker compose down -v
