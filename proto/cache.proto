syntax = "proto3";

package cache;

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  string error = 3;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {
  bool ok = 1;
  string error = 2;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool ok = 1;
  string error = 2;
}

message Entry {
  string key = 1;
  bytes value = 2;
  double expires_at = 3;
  int64 version = 4;
}

message ListEntriesRequest {
  bool include_values = 1;
}

message ListEntriesResponse {
  repeated Entry entries = 1;
}

message GetEntryRequest {
  string key = 1;
}

message GetEntryResponse {
  bool found = 1;
  Entry entry = 2;
  string error = 3;
}

message PutReplicaRequest {
  string key = 1;
  bytes value = 2;
  double expires_at = 3;
  int64 version = 4;
}

message PutReplicaResponse {
  bool ok = 1;
  bool applied = 2;
  string error = 3;
}

message HealthRequest {}

message HealthResponse {
  string node_id = 1;
  bool ok = 2;
}

service CacheNode {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
  rpc GetEntry(GetEntryRequest) returns (GetEntryResponse);
  rpc PutReplica(PutReplicaRequest) returns (PutReplicaResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
