syntax = "proto3";

package cache;

// A coordinator-assigned hybrid logical clock value. Compared as the tuple
// (physical_ms, logical, coordinator_id); last-writer-wins uses that order.
message Version {
  int64 physical_ms = 1;
  int64 logical = 2;
  string coordinator_id = 3;
}

// Outcome of a versioned write (Put, Delete, PutReplica).
enum WriteStatus {
  WRITE_STATUS_UNSPECIFIED = 0;
  APPLIED = 1;          // incoming version was newer; the node wrote it
  ALREADY_CURRENT = 2;  // the node already held this version or a newer one
  ERROR = 3;            // the store raised; see `error`
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  string error = 3;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
  Version version = 3;
  double expires_at = 4;
}

message PutResponse {
  WriteStatus status = 1;
  string error = 2;
}

message DeleteRequest {
  string key = 1;
  Version version = 2;
  double expires_at = 3;
}

message DeleteResponse {
  WriteStatus status = 1;
  string error = 2;
}

message Entry {
  string key = 1;
  bytes value = 2;
  double expires_at = 3;
  Version version = 4;
}

message ListEntriesRequest {
  bool include_values = 1;
}

message ListEntriesResponse {
  repeated Entry entries = 1;
}

message GetEntryRequest {
  string key = 1;
}

message GetEntryResponse {
  bool found = 1;
  Entry entry = 2;
  string error = 3;
}

message PutReplicaRequest {
  string key = 1;
  bytes value = 2;
  double expires_at = 3;
  Version version = 4;
}

message PutReplicaResponse {
  WriteStatus status = 1;
  string error = 2;
}

message HealthRequest {}

message HealthResponse {
  string node_id = 1;
  bool ok = 2;
}

service CacheNode {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
  rpc GetEntry(GetEntryRequest) returns (GetEntryResponse);
  rpc PutReplica(PutReplicaRequest) returns (PutReplicaResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
