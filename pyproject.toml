[project]
name = "distrocache"
version = "0.1.0"
description = "Distributed key-value cache: FastAPI coordinator, gRPC storage nodes, SQLite per node."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shlok Shoorveer Singh Chauhan" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Integration tests start real processes; run them explicitly with `pytest -m integration`.
addopts = ["-m", "not integration"]
# Default "all" keeps every test's sqlite files and logs. One integration run left 14 MB.
tmp_path_retention_policy = "failed"
markers = ["integration: starts a real coordinator and node processes"]
# A hung cluster must fail the test, not the whole CI job.
timeout = 300

[tool.coverage.run]
source = ["backend", "node", "distrocache_common"]
omit = ["distrocache_common/generated/*"]

[tool.coverage.report]
# The unit run must keep unit line coverage at or above this. Set to the measured coverage
# (75%) rounded down to the nearest 5. Raise it as coverage grows; never lower it. Integration
# tests run as separate processes and are not counted here, so real exercised coverage is higher.
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["distrocache_common/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "distrocache_common", "node"]

[tool.mypy]
python_version = "3.11"
files = ["backend", "node", "distrocache_common"]
exclude = ["^distrocache_common/generated/"]
ignore_missing_imports = true
# The default SQLite cache would put .db files in the working tree.
sqlite_cache = false

[[tool.mypy.overrides]]
module = ["distrocache_common.generated.*"]
follow_imports = "skip"
