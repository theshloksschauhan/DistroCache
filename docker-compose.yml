services:
  node1:
    build:
      context: .
      dockerfile: node/Dockerfile
    environment:
      NODE_ID: node1
      GRPC_PORT: 50051
      NODE_ADDRESS: node1:50051
      BACKEND_URL: http://backend:8000
      HEARTBEAT_INTERVAL: 2.0
      REPLICATION_FACTOR: 3
      STORAGE_PATH: /data/cache.db
      TTL_SECONDS: 300
      MAX_ITEMS: 1000
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',50051),1); s.close()"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - node1-data:/data

  node2:
    build:
      context: .
      dockerfile: node/Dockerfile
    environment:
      NODE_ID: node2
      GRPC_PORT: 50051
      NODE_ADDRESS: node2:50051
      BACKEND_URL: http://backend:8000
      HEARTBEAT_INTERVAL: 2.0
      REPLICATION_FACTOR: 3
      STORAGE_PATH: /data/cache.db
      TTL_SECONDS: 300
      MAX_ITEMS: 1000
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',50051),1); s.close()"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - node2-data:/data

  node3:
    build:
      context: .
      dockerfile: node/Dockerfile
    environment:
      NODE_ID: node3
      GRPC_PORT: 50051
      NODE_ADDRESS: node3:50051
      BACKEND_URL: http://backend:8000
      HEARTBEAT_INTERVAL: 2.0
      REPLICATION_FACTOR: 3
      STORAGE_PATH: /data/cache.db
      TTL_SECONDS: 300
      MAX_ITEMS: 1000
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',50051),1); s.close()"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - node3-data:/data

  node4:
    build:
      context: .
      dockerfile: node/Dockerfile
    environment:
      NODE_ID: node4
      GRPC_PORT: 50051
      NODE_ADDRESS: node4:50051
      BACKEND_URL: http://backend:8000
      HEARTBEAT_INTERVAL: 2.0
      REPLICATION_FACTOR: 3
      STORAGE_PATH: /data/cache.db
      TTL_SECONDS: 300
      MAX_ITEMS: 1000
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',50051),1); s.close()"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - node4-data:/data

  node5:
    build:
      context: .
      dockerfile: node/Dockerfile
    environment:
      NODE_ID: node5
      GRPC_PORT: 50051
      NODE_ADDRESS: node5:50051
      BACKEND_URL: http://backend:8000
      HEARTBEAT_INTERVAL: 2.0
      REPLICATION_FACTOR: 3
      STORAGE_PATH: /data/cache.db
      TTL_SECONDS: 300
      MAX_ITEMS: 1000
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',50051),1); s.close()"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - node5-data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ADDRESSES: "node1:50051,node2:50051,node3:50051,node4:50051,node5:50051"
      REPLICATION_FACTOR: 3
      HEALTH_INTERVAL: 2.0
      HEARTBEAT_INTERVAL: 2.0
      HEARTBEAT_TIMEOUT: 6.0
      REQUEST_TIMEOUT: 1.0
      RETRY_ATTEMPTS: 2
      RETRY_BACKOFF: 0.1
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      - node1
      - node2
      - node3
      - node4
      - node5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 5s
      timeout: 2s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "http://localhost:8000"
    environment:
      VITE_API_URL: "http://localhost:8000"
    ports:
      - "3000:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
